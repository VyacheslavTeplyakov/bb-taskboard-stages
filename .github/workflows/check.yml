name: Check

on:
  push:
    branches: [taskboard-stages]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Install the tested BB CLI
        run: npm install --global bb-app@0.47.1
      - run: npm ci
      - name: Check SDK types, TypeScript, tests and build
        run: env -u BB_CLI npm run check
